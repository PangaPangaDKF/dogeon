[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# DogeOS Chikyu runs Cancun opcodes (PUSH0, MCOPY, TLOAD probed with eth_call on 2026-11-07, D-018)
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
chikyu = "https://rpc.testnet.dogeos.com"
local = "http://127.0.0.1:8545"
