version: '3.8'

services:
  # 1. DOGEON: 16-Bit Multiplayer Action RPG & WebSocket Relay
  dogeon:
    build: .
    container_name: dogeon-game
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MAX_ROOM=8

